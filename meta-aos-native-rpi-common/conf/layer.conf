# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory containing .bb and .bbappend files, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb \
            ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "aos-native-rpi-common"
BBFILE_PATTERN_aos-native-rpi-common := "^${LAYERDIR}/"
BBFILE_PRIORITY_aos-native-rpi-common = "14"

LAYERSERIES_COMPAT_aos-native-rpi-common = "wrynose"
