# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory containing .bb and .bbappend files, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*.bb \
            ${LAYERDIR}/recipes*/*.bbappend \
            ${LAYERDIR}/recipes*/*/*.bb \
            ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "aos-rpi-native-install"
BBFILE_PATTERN_aos-rpi-native-install = "^${LAYERDIR}"
BBFILE_PRIORITY_aos-rpi-native-install = "16"

LAYERSERIES_COMPAT_aos-rpi-native-install = "wrynose"
